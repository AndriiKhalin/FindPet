name: 'FindPet Project Board Automation'

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, ready_for_review]
  push:
    branches-ignore: [main, master]  # Trigger on any branch except main/master

jobs:
  automate-issues:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Add new issue to project
        if: github.event.action == 'opened'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "To Do"
          resource_node_id: ${{ github.event.issue.node_id }}

      - name: Move reopened issue to To Do
        if: github.event.action == 'reopened'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "To Do"
          resource_node_id: ${{ github.event.issue.node_id }}

      - name: Move closed issue to Done
        if: github.event.action == 'closed'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "Done"
          resource_node_id: ${{ github.event.issue.node_id }}

  automate-development:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.ref, 'refs/heads/main') && !contains(github.ref, 'refs/heads/master')
    steps:
      - name: Get linked issues from branch
        id: get-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.ref.replace('refs/heads/', '');
            
            // Extract issue number from branch name (e.g., feature/123-some-feature or fix/issue-456)
            const issueMatch = branchName.match(/(\d+)/);
            
            if (issueMatch) {
              const issueNumber = issueMatch[1];
              
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                
                core.setOutput('issue_node_id', issue.data.node_id);
                core.setOutput('issue_found', 'true');
                console.log(`Found linked issue #${issueNumber}`);
              } catch (error) {
                console.log(`Issue #${issueNumber} not found or not accessible`);
                core.setOutput('issue_found', 'false');
              }
            } else {
              console.log('No issue number found in branch name');
              core.setOutput('issue_found', 'false');
            }

      - name: Move linked issue to In Progress
        if: steps.get-issues.outputs.issue_found == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "In progress"
          resource_node_id: ${{ steps.get-issues.outputs.issue_node_id }}

  automate-pull-requests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Get linked issues from PR
        id: get-linked-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            
            // Look for issue references in PR body and title
            const issuePattern = /#(\d+)|close[s]?\s+#(\d+)|fix(es)?\s+#(\d+)|resolve[s]?\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(issuePattern), ...prTitle.matchAll(issuePattern)];
            
            const issueNumbers = matches.map(match => 
              match[1] || match[2] || match[3] || match[4]
            ).filter(Boolean);
            
            if (issueNumbers.length > 0) {
              const issueNumber = issueNumbers[0]; // Take the first found issue
              
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                
                core.setOutput('issue_node_id', issue.data.node_id);
                core.setOutput('issue_found', 'true');
                console.log(`Found linked issue #${issueNumber}`);
              } catch (error) {
                console.log(`Issue #${issueNumber} not found`);
                core.setOutput('issue_found', 'false');
              }
            } else {
              // Try to extract from branch name as fallback
              const branchName = context.payload.pull_request.head.ref;
              const issueMatch = branchName.match(/(\d+)/);
              
              if (issueMatch) {
                const issueNumber = issueMatch[1];
                try {
                  const issue = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber
                  });
                  
                  core.setOutput('issue_node_id', issue.data.node_id);
                  core.setOutput('issue_found', 'true');
                  console.log(`Found linked issue from branch #${issueNumber}`);
                } catch (error) {
                  console.log('No linked issue found');
                  core.setOutput('issue_found', 'false');
                }
              } else {
                console.log('No linked issue found');
                core.setOutput('issue_found', 'false');
              }
            }

      - name: Move linked issue to In Review (PR ready for review)
        if: github.event.action == 'ready_for_review' && steps.get-linked-issues.outputs.issue_found == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "In review"
          resource_node_id: ${{ steps.get-linked-issues.outputs.issue_node_id }}

      - name: Move linked issue to In Review (PR opened and ready)
        if: github.event.action == 'opened' && !github.event.pull_request.draft && steps.get-linked-issues.outputs.issue_found == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "In review"
          resource_node_id: ${{ steps.get-linked-issues.outputs.issue_node_id }}

      - name: Move linked issue to Done (PR merged)
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.get-linked-issues.outputs.issue_found == 'true'
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECTS_PAT }}
          user: AndriiKhalin
          project_id: 6
          status_value: "Done"
          resource_node_id: ${{ steps.get-linked-issues.outputs.issue_node_id }}

      - name: Auto-close linked issue when PR is merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.get-linked-issues.outputs.issue_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            
            const issuePattern = /#(\d+)|close[s]?\s+#(\d+)|fix(es)?\s+#(\d+)|resolve[s]?\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(issuePattern), ...prTitle.matchAll(issuePattern)];
            
            const issueNumbers = matches.map(match => 
              match[1] || match[2] || match[3] || match[4]
            ).filter(Boolean);
            
            if (issueNumbers.length > 0) {
              const issueNumber = issueNumbers[0];
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
              
              console.log(`Closed issue #${issueNumber}`);
            }
  copilot-review:
    runs-on: ubuntu-latest
    if: '!github.event.pull_request.draft'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Request Copilot Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Add Copilot as a reviewer
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              team_reviewers: ['copilot']  // If you have Copilot team set up
            });
            
            // Add a comment requesting review
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@copilot please review this PR according to our project guidelines'
            });